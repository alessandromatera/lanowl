# lanowl — docker compose. From the repository root:
#
#   docker compose -f docker/compose.yaml up -d
#   docker exec lanowl lanowl --setup-code            # then open http://<this machine>:8088/
#
# The images come from GHCR (amd64 and arm64, the latest release). Compose builds them from
# this checkout only when the pull fails; `docker compose -f docker/compose.yaml build` runs
# the code you have instead.
#
# The config folder starts empty: at its first start lanowl writes config.yaml, inventory.yaml,
# secrets.yaml and its ssh key there, and the dashboard fills them (Settings, the first-run
# setup). They stay plain files you can edit by hand. docker/.env is optional (env.example).
#
# The model's sandboxed shells, once shell.enabled is on (Settings shows this line filled in):
#   LANOWL_HOST_IP=<this machine's address> docker compose -f docker/compose.yaml --profile shell up -d
#
# Updating lanowl from its own Settings page (optional; off unless you start it):
#   docker compose -f docker/compose.yaml --profile updater up -d
# The updater is the ONE container that holds Docker's socket, which is root on this machine.
# It is the same image with no network, a read-only disk and no capabilities; it pulls lanowl's
# own images and recreates lanowl's own containers, and lanowl can only tell it "update".
#
# Host networking: on Linux, lanowl sees the network as the host does — mtr and traceroute see
# every hop, ARP and packet captures see the real wire. (Docker Desktop on a Mac or Windows
# works too, behind its own NAT: per-hop tools then see only the target.)
# The host must allow unprivileged ping: sysctl net.ipv4.ping_group_range="0 2147483647"
# (Debian ships it closed, and then every device reads DOWN).
name: lanowl

services:
  lanowl:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ghcr.io/alessandromatera/lanowl:latest
    container_name: lanowl
    restart: unless-stopped
    network_mode: host
    env_file: [{path: .env, required: false}]    # optional: docker/env.example says what it can set
    volumes:
      - ../config:/config                       # config.yaml, inventory.yaml, secrets.yaml, the ssh key,
                                                # profiles: read-write, lanowl and its dashboard write them
      - lanowl-state:/state                     # the database, the log, the outbox
      - lanowl-ssh:/root/.ssh                   # known_hosts for the host-log watcher
      - sandbox-sock:/run/sandbox:ro
      - sandbox-offline-sock:/run/sandbox-offline:ro
      - updater-sock:/run/updater               # the updater's socket, once it runs (and what it did: last.json)

  # The model's shell, for the owner's questions: internet open, the LAN for handshakes only.
  sandbox:
    profiles: ["shell"]
    build:
      context: ..
      dockerfile: docker/sandbox/Dockerfile
    image: ghcr.io/alessandromatera/lanowl-sandbox:latest
    container_name: lanowl-sandbox
    restart: unless-stopped
    networks: [sandbox]
    read_only: true
    tmpfs:
      - /work:size=64m,mode=1777
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, SETUID, SETGID, SETPCAP, CHOWN]   # NET_ADMIN only to set its own firewall, then dropped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    env_file: [{path: .env, required: false}]
    environment:
      LANOWL_HOST_IP: ${LANOWL_HOST_IP:-}       # the host it walls off: docker/.env, or the command line
    volumes:
      - sandbox-sock:/run/sandbox

  # The hourly audit's shell: the same walls, and no internet and no DNS at all.
  sandbox-offline:
    profiles: ["shell"]
    image: ghcr.io/alessandromatera/lanowl-sandbox:latest
    pull_policy: never
    container_name: lanowl-sandbox-offline
    restart: unless-stopped
    networks: [sandbox]
    read_only: true
    tmpfs:
      - /work:size=64m,mode=1777
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, SETUID, SETGID, SETPCAP, CHOWN]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    env_file: [{path: .env, required: false}]
    environment:
      LANOWL_HOST_IP: ${LANOWL_HOST_IP:-}
      SANDBOX_OFFLINE: "1"
    volumes:
      - sandbox-offline-sock:/run/sandbox

  # The updater: Settings → lanowl's "Update now" and `self_update.auto`. It takes only the one word
  # "update" from lanowl and decides the rest itself (src/lanowl/updater.py): it touches only this
  # compose project's lanowl, sandbox and sandbox-offline containers, and puts the old ones back
  # when the new lanowl has not answered for 3 minutes.
  updater:
    profiles: ["updater"]
    image: ghcr.io/alessandromatera/lanowl:latest
    pull_policy: never                          # it runs the image lanowl already pulled
    container_name: lanowl-updater
    command: ["python", "-m", "lanowl.updater"]
    restart: unless-stopped
    network_mode: none                          # the Docker daemon does the pulling, not this container
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 32
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # root on this machine: the reason it is a container of its own
      - updater-sock:/run/updater

volumes:
  lanowl-state:
  lanowl-ssh:
  sandbox-sock:
  sandbox-offline-sock:
  updater-sock:

networks:
  sandbox:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-lanowl-sb
    ipam:
      config:
        - subnet: 172.31.99.0/24
