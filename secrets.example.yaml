# lanowl — device logins. Copy to secrets.yaml, chmod 600, mount it read-only.
#
# Never in config.yaml or inventory.yaml, so those two can be shared or versioned. Read again
# whenever it changes: an updated password needs no restart. A password reaches ssh through
# SSH_ASKPASS and sudo through stdin — never argv, a log line, a message, or the model.

# Named logins; several devices may share one.
logins:
  routers: {user: admin, password: "change-me"}
  # server:  {user: admin, password: "change-me"}

# Address -> login name. A device in the inventory may name its own instead (`credentials:`),
# which wins over this map.
devices:
  # 192.168.88.10: server
